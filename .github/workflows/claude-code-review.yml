name: Claude Code Review

# Runs only on demand: comment "/claude-review" on a pull request.
# Comment-triggered workflows run from the default branch, so this works once merged to main.
on:
  issue_comment:
    types: [created]

jobs:
  # Shows on the "/claude-review" comment that the review has started. A separate job, so that only this
  # small step gets write access, not the job that runs Claude on the pull request content.
  # Only for users with write access, the same people the action itself lets run the review.
  react:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude-review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      # Reactions on comments of a pull request need pull-requests: write (issues: write works only on issues)
      pull-requests: write
    steps:
      - name: React to the trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=eyes

  claude-review:
    # Only on pull requests (not issues) and only when the comment asks for it.
    # The action itself also checks that the commenter has write access to the repository.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/claude-review')

    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
